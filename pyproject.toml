[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-pkg"
version = "0.1.0"
description = "Unified wrapper for native package managers, with a name resolver and source hierarchy."
requires-python = ">=3.11"
dependencies = ["rapidfuzz>=3", "textual>=8", "rich>=13"]

[project.scripts]
uni = "uni.cli:main"

[tool.setuptools]
packages = ["uni", "uni.data"]

[tool.setuptools.package-data]
"uni.data" = ["*.toml"]
